name: Accessibility tracker

# Regenerates the PR tables in README.md from .github/data/tracked_prs.json and
# checks the live GitHub API for merged PRs (by the tracked authors) that are
# missing from the manifest, opening an issue if any are found.

on:
  schedule:
    - cron: '17 6 * * 1'   # every Monday, 06:17 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # commit regenerated README
  issues: write             # open/append the "tracker is behind" issue

concurrency:
  group: accessibility-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate tables and detect untracked PRs
        id: gen
        run: python .github/scripts/render_tracker.py

      - name: Commit regenerated README
        if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: regenerate accessibility tracker tables"
          git push

      - name: Report untracked merged PRs
        if: steps.gen.outputs.has_new == 'true'
        run: |
          title="Tracker is behind: untracked merged PRs"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file tracker-report.md
          else
            gh issue create --title "$title" --body-file tracker-report.md
          fi
